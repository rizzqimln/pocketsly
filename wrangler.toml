# Cloudflare Pages + D1 Serverless Database configuration.
#
# When connecting via the Cloudflare Dashboard:
#   1. Project Settings -> Build & Deployments -> Build output directory: static
#   2. Project Settings -> Functions -> D1 Database Bindings:
#      Variable name: DB  ->  Select your D1 database (e.g. "pocketsly-db")
name = "pocketsly"
compatibility_date = "2025-06-01"
pages_build_output_dir = "static"

[[d1_databases]]
binding = "DB"
database_name = "pocketsly-db"
database_id = "pocketsly-db"
